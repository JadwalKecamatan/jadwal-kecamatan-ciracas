<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Kegiatan Kecamatan Ciracas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-start p-4">

  <div class="max-w-4xl w-full bg-white shadow-xl rounded-2xl overflow-hidden p-6 md:p-8">
    
    <div class="border-b pb-4 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">JADWAL KECAMATAN CIRACAS</h1>
        <p class="text-sm text-slate-500">Portal Informasi & Dokumen Resmi Dinas</p>
      </div>
      <div class="flex items-center gap-2">
        <input type="date" id="selectedDate" class="border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        <button onclick="loadAgendas()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
          <i class="fa-solid fa-rotate-right mr-1"></i> Muat
        </button>
      </div>
    </div>

    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
      <h2 class="text-sm font-semibold text-slate-700 mb-3"><i class="fa-solid fa-pen-to-square mr-1 text-blue-600"></i> Tambah / Edit Agenda</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Pukul</label>
          <input type="text" id="inputPukul" placeholder="Contoh: 08.00 - Selesai" class="w-full border rounded-lg px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-medium text-slate-600 mb-1">Acara / Kegiatan</label>
          <input type="text" id="inputAcara" placeholder="Nama kegiatan..." class="w-full border rounded-lg px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Tempat</label>
          <input type="text" id="inputTempat" placeholder="Lokasi kegiatan..." class="w-full border rounded-lg px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Asal Undangan / Instansi</label>
          <input type="text" id="inputAsal" placeholder="Asal instansi..." class="w-full border rounded-lg px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Pejabat / Disposisi</label>
          <input type="text" id="inputPejabat" placeholder="Camat / Wakamat / Kasi..." class="w-full border rounded-lg px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div class="flex justify-end gap-2">
        <button onclick="clearForm()" class="bg-gray-200 hover:bg-gray-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition">Reset</button>
        <button onclick="saveAgenda()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition shadow-sm">
          <i class="fa-solid fa-plus mr-1"></i> Simpan Agenda
        </button>
      </div>
    </div>

    <div>
      <h2 class="text-lg font-bold text-slate-800 mb-3">Jadwal Kegiatan Harian</h2>
      <div class="overflow-x-auto border rounded-xl">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-800 text-white text-xs uppercase tracking-wider">
              <th class="p-3 w-12 text-center">No</th>
              <th class="p-3 w-32">Pukul</th>
              <th class="p-3">Acara</th>
              <th class="p-3 w-40">Tempat</th>
              <th class="p-3 w-32">Pejabat</th>
              <th class="p-3 w-20 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="agendaTableBody" class="divide-y divide-slate-200 text-sm">
          </tbody>
        </table>
      </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-2 rounded-lg shadow-lg text-sm hidden transition-all duration-300">
      Pemberitahuan berhasil
    </div>

  </div>

  <script>
    // URL Web App terbaru yang Anda berikan
    const SHEETDB_URL = "https://script.google.com/macros/s/AKfycbzClABpAtQOUV8_si_M0TiUj4b51RJ2qpHIaF54mFGHtiSdvUY-koAvRAFMVt86-OUd/exec";

    let currentAgendas = [];
    let currentISO = "";
    let editIndex = -1;

    window.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split("T")[0];
      document.getElementById("selectedDate").value = today;
      currentISO = today;
      loadAgendas();

      document.getElementById("selectedDate").addEventListener("change", (e) => {
        currentISO = e.target.value;
        loadAgendas();
      });
    });

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      toast.classList.remove("hidden");
      setTimeout(() => {
        toast.classList.add("hidden");
      }, 3000);
    }

    async function loadAgendas() {
      showToast("Memuat data terbaru...");
      try {
        const response = await fetch(SHEETDB_URL);
        const data = await response.json();
        
        currentAgendas = data.filter(item => {
          if (!item.tanggal) return false;
          let rowDate = String(item.tanggal).split("T")[0].trim();
          return rowDate === currentISO;
        });

        renderTable();
        showToast("Data dimuat dari Cloud ✓");
      } catch (error) {
        console.error("Gagal memuat:", error);
        showToast("Gagal terhubung ke Google Sheets!");
      }
    }

    function renderTable() {
      const tbody = document.getElementById("agendaTableBody");
      tbody.innerHTML = "";

      if (currentAgendas.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Belum ada agenda pada tanggal ini.</td></tr>`;
        return;
      }

      currentAgendas.forEach((item, index) => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50";
        tr.innerHTML = `
          <td class="p-3 text-center text-slate-500">${index + 1}</td>
          <td class="p-3 font-medium text-slate-700">${item.pukul || "-"}</td>
          <td class="p-3 text-slate-900">${item.acara || "-"}</td>
          <td class="p-3 text-slate-600">${item.tempat || "-"}</td>
          <td class="p-3 text-slate-600">${item.pejabat || "-"}</td>
          <td class="p-3 text-center">
            <button onclick="editAgenda(${index})" class="text-blue-600 hover:text-blue-800 mr-2"><i class="fa-solid fa-pen"></i></button>
            <button onclick="deleteAgenda(${index})" class="text-rose-600 hover:text-rose-800"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function saveAgenda() {
      const pukul = document.getElementById("inputPukul").value;
      const acara = document.getElementById("inputAcara").value;
      const tempat = document.getElementById("inputTempat").value;
      const asal = document.getElementById("inputAsal").value;
      const pejabat = document.getElementById("inputPejabat").value;

      if (!acara && !pukul) {
        alert("Minimal isi pukul atau acara kegiatan!");
        return;
      }

      const newItem = {
        tanggal: currentISO,
        pukul: pukul,
        acara: acara,
        tempat: tempat,
        asal: asal,
        pejabat: pejabat,
        delegasi: "",
        pendamping: "",
        keterangan: "",
        susulan: false,
        revisiItem: false,
        photos: ""
      };

      clearForm();
      showToast("Menyimpan ke Google Sheets...");

      try {
        await fetch(SHEETDB_URL, {
          method: "POST", 
          mode: "no-cors",
          body: JSON.stringify({ 
            action: "APPEND", 
            tanggal: currentISO, 
            data: newItem 
          })
        });
        
        setTimeout(async () => {
          await loadAgendas();
          showToast("Berhasil disimpan & disinkronkan ✓");
        }, 1500);

      } catch (e) {
        console.error("Gagal menyimpan:", e);
        showToast("Gagal menyimpan ke cloud.");
      }
    }

    function editAgenda(index) {
      const item = currentAgendas[index];
      document.getElementById("inputPukul").value = item.pukul || "";
      document.getElementById("inputAcara").value = item.acara || "";
      document.getElementById("inputTempat").value = item.tempat || "";
      document.getElementById("inputAsal").value = item.asal || "";
      document.getElementById("inputPejabat").value = item.pejabat || "";
      editIndex = index;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteAgenda(index) {
      if (confirm("Yakin ingin menghapus agenda ini?")) {
        currentAgendas.splice(index, 1);
        
        showToast("Memperbarui data di cloud...");
        try {
          await fetch(SHEETDB_URL, { 
            method: "POST", 
            mode: "no-cors", 
            body: JSON.stringify({ action: "DELETE_BY_DATE", tanggal: currentISO }) 
          });
          
          for (let item of currentAgendas) {
            await fetch(SHEETDB_URL, {
              method: "POST", 
              mode: "no-cors",
              body: JSON.stringify({ 
                action: "APPEND", 
                tanggal: currentISO, 
                data: item 
              })
            });
          }

          setTimeout(async () => {
            await loadAgendas();
            showToast("Berhasil dihapus ✓");
          }, 1500);

        } catch (e) {
          console.error("Gagal sinkron:", e);
        }
      }
    }

    function clearForm() {
      document.getElementById("inputPukul").value = "";
      document.getElementById("inputAcara").value = "";
      document.getElementById("inputTempat").value = "";
      document.getElementById("inputAsal").value = "";
      document.getElementById("inputPejabat").value = "";
      editIndex = -1;
    }
  </script>
</body>
</html>
